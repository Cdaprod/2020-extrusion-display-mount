name: Regenerate CAD geometry and previews

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/regenerate-cad.yml'
  pull_request:
    paths:
      - 'cad/**'
      - 'projects/**'
      - 'manufacturing.yaml'
      - 'requirements.txt'
      - 'tests/**'
      - 'docs/validation.json'
      - '.github/workflows/regenerate-cad.yml'
  workflow_dispatch:

concurrency:
  group: regenerate-cad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD and renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxrender1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt matplotlib
      - name: Generate actual STEP, STL, validation and PNG previews
        run: xvfb-run -a python src/build.py
      - name: Delete obsolete separated-carrier artifacts
        run: git rm -f --ignore-unmatch step/carrier.step stl/carrier.stl previews/display_carrier.png
      - name: Run parametric engineering tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated artifacts to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A step/ stl/ previews/ docs/validation.json
          if ! git diff --cached --quiet; then
            git commit -m "build(cad): regenerate integral-arm geometry, STEP/STL, and previews"
            git fetch origin "${GITHUB_REF_NAME}"
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse FETCH_HEAD)" ]; then
              echo "::error::Source branch advanced during build; refusing stale artifact push"
              exit 1
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  validate-manufacturing:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxrender1
          python -m pip install -r requirements.txt matplotlib
      - name: Rebuild historical generator independently of native exports
        run: xvfb-run -a python src/build.py --out /tmp/neptune-cad-validation
      - name: Validate native manufacturing inputs, BREP exports and existing engineering tests
        run: python -m unittest discover -s tests -v
